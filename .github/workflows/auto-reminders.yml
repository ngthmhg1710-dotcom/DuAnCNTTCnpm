name: Nhắc nhở tự động

# Gọi API /api/jobs/run mỗi giờ: nhắc sinh viên đã đăng ký trước giờ hoạt động diễn ra,
# và (nếu bật trong web) nhắc tiêu chí hằng ngày. Dùng GitHub thay cho bộ hẹn giờ trong server
# vì server Render gói miễn phí tự ngủ khi không có người dùng.
# Cần 2 Secret trong GitHub repo: API_URL (vd https://student-activity-api-xxxx.onrender.com) và CRON_SECRET (trùng biến CRON_SECRET trên Render).

on:
  schedule:
    - cron: '7 * * * *' # phút thứ 7 mỗi giờ (tránh giờ cao điểm của GitHub)
  workflow_dispatch: {} # cho phép bấm chạy thử bằng tay ở tab Actions

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi /api/jobs/run
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Thiếu secret API_URL hoặc CRON_SECRET"; exit 1; fi
          # Render gói miễn phí có thể đang ngủ: thử tối đa 4 lần, mỗi lần chờ tối đa 90 giây.
          curl -sS --fail-with-body --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "x-cron-secret: $CRON_SECRET" "$API_URL/api/jobs/run"
          echo
